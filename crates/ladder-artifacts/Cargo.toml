[package]
name = "ladder-artifacts"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Portable Ladder Graph ontology, form, document, and workflow-bundle compiler"

[dependencies]
lgir-core = { path = "../lgir-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
hex = "0.4"
