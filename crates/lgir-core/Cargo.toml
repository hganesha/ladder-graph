[package]
name = "lgir-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Deterministic Ladder Graph IR validation and target compilation core"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
hex = "0.4"
wasm-bindgen = "0.2"

[dev-dependencies]
pretty_assertions = "1"
