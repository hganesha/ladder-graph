[package]
name = "lgir-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Browser WebAssembly facade for the Ladder Graph compiler"

[lib]
name = "lgir_core"
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
lgir-core = { path = "../lgir-core" }
serde = "1"
serde_json = "1"
wasm-bindgen = "0.2"
