[package]
name = "ladder-graph-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Local-first MCP companion for Ladder Graph"

[[bin]]
name = "ladder-graph-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
hex = "0.4"
ladder-catalog = { path = "../ladder-catalog" }
lgir-core = { path = "../lgir-core" }
rand = "0.9"
rmcp = { version = "3.1.2", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "net"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
