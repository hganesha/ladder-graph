apiVersion: ladder.dev/v1alpha1
kind: Ontology
metadata:
  name: financial-services
  title: Financial Services Ontology
  description: Fundamental entities and relationships shared across Financial Services decision contracts.
  version: 0.1.0
  source:
    system: lattice
    sourceId: financial-services-ontology
    sourceVersion: 0.1.0
    sourceDigest: sha256:4369408a56aee642f3815bf2cc0d4f4ab8f7fc06d49a4e9ad74058c0a4f8d9c3
spec:
  types:
    - id: counterparty
      label: Counterparty
      description: A party against which the enterprise carries financial or contractual exposure.
      sourcePath: /ontology/entityTypes/0
      properties:
        - id: counterparty.lei
          label: Legal entity identifier
          description: ISO 17442 legal entity identifier.
          dataType: string
          required: true
          identifier: true
          sourcePath: /ontology/entityTypes/0/properties/0
        - id: counterparty.rating
          label: Internal credit rating
          description: Current approved internal credit grade.
          dataType: string
          sourcePath: /ontology/entityTypes/0/properties/1
        - id: counterparty.sector
          label: Industry sector
          description: Governed industry classification.
          dataType: string
          sourcePath: /ontology/entityTypes/0/properties/2
    - id: legal_entity
      label: Legal Entity
      description: A legally incorporated entity that enters transactions and owns exposure.
      sourcePath: /ontology/entityTypes/1
      properties:
        - id: legal_entity.jurisdiction
          label: Jurisdiction
          description: Primary legal jurisdiction.
          dataType: string
          required: true
          sourcePath: /ontology/entityTypes/1/properties/0
    - id: instrument
      label: Instrument
      description: A contract or security that creates financial rights and obligations.
      sourcePath: /ontology/entityTypes/2
      properties: []
    - id: position
      label: Position
      description: An owned or owed quantity of an instrument at a point in time.
      sourcePath: /ontology/entityTypes/3
      properties:
        - id: position.notional
          label: Notional amount
          description: Contractual amount used to calculate cash flows.
          dataType: decimal
          required: true
          sourcePath: /ontology/entityTypes/3/properties/0
        - id: position.currency
          label: Currency
          description: ISO 4217 notional currency.
          dataType: string
          required: true
          sourcePath: /ontology/entityTypes/3/properties/1
    - id: portfolio
      label: Portfolio
      description: A governed collection of positions used for risk and performance aggregation.
      sourcePath: /ontology/entityTypes/4
      properties: []
    - id: netting_agreement
      label: Netting Agreement
      description: An enforceable agreement that determines which obligations may be netted.
      sourcePath: /ontology/entityTypes/5
      properties: []
    - id: collateral
      label: Collateral
      description: Assets pledged to mitigate an exposure under an agreement.
      sourcePath: /ontology/entityTypes/6
      properties:
        - id: collateral.market_value
          label: Market value
          description: Current governed collateral valuation.
          dataType: decimal
          required: true
          sourcePath: /ontology/entityTypes/6/properties/0
    - id: credit_limit
      label: Credit Limit
      description: The approved maximum exposure for a governed scope.
      sourcePath: /ontology/entityTypes/7
      properties:
        - id: credit_limit.amount
          label: Approved amount
          description: Maximum approved exposure for the limit scope.
          dataType: decimal
          required: true
          sourcePath: /ontology/entityTypes/7/properties/0
    - id: regulatory_report
      label: Regulatory Report
      description: A governed submission containing exposure and capital disclosures.
      sourcePath: /ontology/entityTypes/8
      properties: []
    - id: customer_party
      label: Customer Party
      description: A person or organization receiving financial services.
      sourcePath: /ontology/entityTypes/9
      properties:
        - id: customer_party.applicant_legal_name
          label: Applicant Legal Name
