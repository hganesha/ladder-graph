          label: Guarantor Name
          description: Guarantor legal name.
          dataType: string
          required: true
          identifier: false
          sourcePath: /ontology/entityTypes/12/properties/0
        - id: guaranty.guarantor_names
          label: Guarantor Names
          description: Individual or entity guarantors.
          dataType: string
          required: false
          identifier: false
          sourcePath: /ontology/entityTypes/12/properties/1
        - id: guaranty.continuing_guaranty
          label: Continuing Guaranty
          description: Whether guaranty is continuing.
          dataType: boolean
          required: false
          identifier: false
