        - id: customer_party.borrower_industry
          label: Borrower Industry
          description: Industry or NAICS description.
          dataType: string
          required: false
          identifier: false
          sourcePath: /ontology/entityTypes/9/properties/21
        - id: customer_party.borrower_marital_status
