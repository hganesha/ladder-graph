apiVersion: ladder.dev/v1alpha1
kind: Workflow
metadata:
  name: humanities-inquiry-seminar
  title: Humanities inquiry + seminar
  description: Read primary material closely, establish its historical frame, then test the
    interpretation through Socratic synthesis.
  version: 1.0.0
spec:
  objective: Produce a text-grounded, historically responsible interpretation and an open-ended seminar guide.
  policies:
    maxConcurrency: 3
    onFailure: preserve-completed
    requireApprovalFor: []
  nodes:
    - id: brief
      kind: input
      name: Inquiry packet
      summary: Shared question, primary texts, historical scope, audience, and citation standard.
      position:
        x: 100
        y: 220
    - id: perspective-a
      kind: agent
      name: Close reading
      summary: Find the passages and formal choices that bear on the question.
      role: Great Books close-reading tutor
      prompt: Build the interpretation from specific passages, language, and structure. Preserve competing
        readings and identify textual evidence that complicates the initial thesis.
      capabilities:
        skills:
          - close-reading
        tools:
          - read
          - search
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - findings
          - evidence
        properties:
          findings:
            type: array
            items:
              type: string
          evidence:
            type: array
            items:
              type: string
      position:
        x: 380
        y: 90
    - id: perspective-b
      kind: agent
      name: Historical context
      summary: Test provenance, period context, and later framing.
      role: Historical research analyst
      prompt: Distinguish primary and secondary evidence, evaluate provenance and bias, guard against
        anachronism, and mark claims the historical record cannot settle.
      capabilities:
        skills:
          - historical-research
        tools:
          - read
          - search
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - findings
          - risks
        properties:
          findings:
            type: array
            items:
              type: string
          risks:
            type: array
            items:
              type: string
      position:
        x: 380
        y: 350
    - id: join
      kind: join
      name: Perspective barrier
      summary: Wait for both independent perspectives.
      config:
        join: all
      position:
        x: 660
        y: 220
    - id: synthesis
      kind: agent
      name: Socratic synthesis
      summary: Reconcile evidence into a defensible interpretation and discussion arc.
      role: Interdisciplinary seminar facilitator
      prompt: Synthesize without flattening disagreement. State the strongest interpretation, its limits,
        and a sequence of genuinely open questions grounded in the supplied texts.
      capabilities:
        skills:
          - seminar-facilitation
        tools:
          - read
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - recommendation
          - actions
          - openQuestions
        properties:
          recommendation:
            type: string
          actions:
            type: array
            items:
              type: string
          openQuestions:
            type: array
            items:
              type: string
      position:
        x: 900
        y: 150
    - id: evaluation
      kind: evaluate
      name: Humanities evidence gate
      summary: Check the recommendation against its evidence and contract.
      role: Historiography and argument critic
      prompt: Pass only when interpretive claims cite textual evidence, historical claims distinguish
        source types, counter-readings are represented charitably, and uncertainty is explicit.
      capabilities:
        skills:
          - evaluation
        tools:
          - read
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - score
          - passed
          - reasons
        properties:
          score:
            type: number
          passed:
            type: boolean
          reasons:
            type: array
            items:
              type: string
      config:
        threshold: 0.85
      position:
        x: 900
        y: 330
    - id: output
      kind: output
      name: Inquiry and seminar guide
      summary: Interpretive thesis, textual evidence, historical context, counter-readings, citations, and
        discussion questions.
      position:
        x: 1180
        y: 220
  edges:
    - id: e1
      from: brief
      to: perspective-a
      kind: data
      contract: Brief
    - id: e2
      from: brief
      to: perspective-b
      kind: data
      contract: Brief
    - id: e3
      from: perspective-a
      to: join
      kind: data
      contract: EvidenceSet
    - id: e4
      from: perspective-b
      to: join
      kind: data
      contract: RiskSet
    - id: e5
      from: join
      to: synthesis
      kind: dependency
    - id: e6
      from: synthesis
      to: evaluation
      kind: data
      contract: Recommendation
    - id: e7
      from: evaluation
      to: output
      kind: control
      condition: passed == true
