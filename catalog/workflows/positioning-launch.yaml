apiVersion: ladder.dev/v1alpha1
kind: Workflow
metadata:
  name: positioning-launch-experiment
  title: Positioning + launch experiment
  description: Ground the message in customer urgency and alternatives, then design a measurable launch test.
  version: 1.0.0
spec:
  objective: Produce differentiated positioning and a falsifiable launch experiment.
  policies:
    maxConcurrency: 3
    onFailure: preserve-completed
    requireApprovalFor: []
  nodes:
    - id: brief
      kind: input
      inputSchema:
        type: object
        required: [text]
        properties:
          text: { type: string, description: The requester's objective, source material, or instructions. }
        x-ladder-input-mode: text
      name: Market brief
      summary: Product, target market, evidence, alternatives, constraints, and launch goal.
      position:
        x: 100
        y: 220
    - id: perspective-a
      kind: agent
      inlineRole: true
      name: Customer urgency
      summary: Identify the beachhead user, trigger, pain, and proof needed.
      role: Customer insight researcher
      prompt: Define the highest-urgency segment, triggering event, current workaround, desired progress,
        and proof that would change behavior.
      capabilities:
        skills:
          - research
        tools:
          - read
          - search
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - findings
          - evidence
        properties:
          findings:
            type: array
            items:
              type: string
          evidence:
            type: array
            items:
              type: string
      position:
        x: 380
        y: 90
    - id: perspective-b
      kind: agent
      inlineRole: true
      name: Competitive frame
      summary: Map alternatives and credible differentiation.
      role: Market intelligence strategist
      prompt: Map direct and indirect alternatives. Identify defensible differences, table stakes, and
        claims the evidence cannot support.
      capabilities:
        skills:
          - decision-analysis
        tools:
          - read
          - search
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - findings
          - risks
        properties:
          findings:
            type: array
            items:
              type: string
          risks:
            type: array
            items:
              type: string
      position:
        x: 380
        y: 350
    - id: join
      kind: join
      name: Perspective barrier
      summary: Wait for both independent perspectives.
      config:
        join: all
      position:
        x: 660
        y: 220
    - id: synthesis
      kind: agent
      inlineRole: true
      name: Launch strategy
      summary: Turn market evidence into message, channel, and test.
      role: Go-to-market strategist
      prompt: Write positioning, proof points, objections, beachhead channel, experiment design, success
        threshold, and stop condition.
      capabilities:
        skills:
          - product-management
        tools:
          - read
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - recommendation
          - actions
          - openQuestions
        properties:
          recommendation:
            type: string
          actions:
            type: array
            items:
              type: string
          openQuestions:
            type: array
            items:
              type: string
      position:
        x: 900
        y: 150
    - id: evaluation
      kind: evaluate
      inlineRole: true
      name: Message credibility gate
      summary: Check the recommendation against its evidence and contract.
      role: GTM review lead
      prompt: Pass only when the positioning is specific, differentiated, evidence-backed, and paired with
        a measurable experiment.
      capabilities:
        skills:
          - evaluation
        tools:
          - read
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - score
          - passed
          - reasons
        properties:
          score:
            type: number
          passed:
            type: boolean
          reasons:
            type: array
            items:
              type: string
      config:
        threshold: 0.85
      position:
        x: 900
        y: 330
    - id: output
      kind: output
      name: Launch experiment
      summary: Positioning, proof, channel hypothesis, experiment, and decision threshold.
      position:
        x: 1180
        y: 220
  edges:
    - id: e1
      from: brief
      to: perspective-a
      kind: data
      contract: Brief
    - id: e2
      from: brief
      to: perspective-b
      kind: data
      contract: Brief
    - id: e3
      from: perspective-a
      to: join
      kind: data
      contract: EvidenceSet
    - id: e4
      from: perspective-b
      to: join
      kind: data
      contract: RiskSet
    - id: e5
      from: join
      to: synthesis
      kind: dependency
    - id: e6
      from: synthesis
      to: evaluation
      kind: data
      contract: Recommendation
    - id: e7
      from: evaluation
      to: output
      kind: control
      condition: passed == true
