apiVersion: ladder.dev/v1alpha1
kind: Workflow
metadata:
  name: ux-audit-redesign-brief
  title: UX audit + redesign brief
  description: Inspect task friction and accessibility in parallel, then turn the evidence into a
    focused redesign brief.
  version: 1.0.0
spec:
  objective: Produce a prioritized, evidence-backed redesign brief for a defined product journey.
  policies:
    maxConcurrency: 3
    onFailure: preserve-completed
    requireApprovalFor: []
  nodes:
    - id: brief
      kind: input
      name: Product journey
      summary: Target users, task, current screens, business goal, and known constraints.
      position:
        x: 100
        y: 220
    - id: perspective-a
      kind: agent
      name: Journey audit
      summary: Find comprehension, hierarchy, and interaction friction.
      role: Senior product designer
      prompt: Audit the journey screen by screen. Tie each finding to user intent, visible evidence,
        severity, and a concrete design principle.
      capabilities:
        skills:
          - ux-audit
        tools:
          - read
          - search
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - findings
          - evidence
        properties:
          findings:
            type: array
            items:
              type: string
          evidence:
            type: array
            items:
              type: string
      position:
        x: 380
        y: 90
    - id: perspective-b
      kind: agent
      name: Accessibility audit
      summary: Find keyboard, contrast, semantics, and assistive-tech risks.
      role: Accessibility specialist
      prompt: Review the same journey against WCAG and inclusive interaction principles. Prioritize
        barriers by user impact.
      capabilities:
        skills:
          - accessibility
        tools:
          - read
          - search
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - findings
          - risks
        properties:
          findings:
            type: array
            items:
              type: string
          risks:
            type: array
            items:
              type: string
      position:
        x: 380
        y: 350
    - id: join
      kind: join
      name: Perspective barrier
      summary: Wait for both independent perspectives.
      config:
        join: all
      position:
        x: 660
        y: 220
    - id: synthesis
      kind: agent
      name: Redesign brief
      summary: Translate findings into a coherent design direction.
      role: Product design lead
      prompt: Synthesize the evidence into design principles, prioritized changes, preserved strengths,
        success criteria, and a test plan.
      capabilities:
        skills:
          - product-design
        tools:
          - read
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - recommendation
          - actions
          - openQuestions
        properties:
          recommendation:
            type: string
          actions:
            type: array
            items:
              type: string
          openQuestions:
            type: array
            items:
              type: string
      position:
        x: 900
        y: 150
    - id: evaluation
      kind: evaluate
      name: Brief quality gate
      summary: Check the recommendation against its evidence and contract.
      role: Design critique lead
      prompt: Pass only when every recommendation addresses evidenced friction, preserves working
        patterns, and has a verifiable success criterion.
      capabilities:
        skills:
          - evaluation
        tools:
          - read
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - score
          - passed
          - reasons
        properties:
          score:
            type: number
          passed:
            type: boolean
          reasons:
            type: array
            items:
              type: string
      config:
        threshold: 0.85
      position:
        x: 900
        y: 330
    - id: output
      kind: output
      name: Redesign brief
      summary: Prioritized findings, design direction, accessibility requirements, and validation plan.
      position:
        x: 1180
        y: 220
  edges:
    - id: e1
      from: brief
      to: perspective-a
      kind: data
      contract: Brief
    - id: e2
      from: brief
      to: perspective-b
      kind: data
      contract: Brief
    - id: e3
      from: perspective-a
      to: join
      kind: data
      contract: EvidenceSet
    - id: e4
      from: perspective-b
      to: join
      kind: data
      contract: RiskSet
    - id: e5
      from: join
      to: synthesis
      kind: dependency
    - id: e6
      from: synthesis
      to: evaluation
      kind: data
      contract: Recommendation
    - id: e7
      from: evaluation
      to: output
      kind: control
      condition: passed == true
