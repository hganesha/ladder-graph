apiVersion: ladder.dev/v1alpha1
kind: Workflow
metadata:
  name: values-to-action-system
  title: Values → sustainable action system
  description: Align direction and behavior design independently, then build a small maintainable
    system with a review cadence.
  version: 1.0.0
spec:
  objective: Turn a personally meaningful direction into a realistic, revisable action system.
  policies:
    maxConcurrency: 3
    onFailure: preserve-completed
    requireApprovalFor: []
  nodes:
    - id: brief
      kind: input
      name: Life or work objective
      summary: Current situation, desired change, stated values, commitments, constraints, and available
        support.
      position:
        x: 100
        y: 220
    - id: perspective-a
      kind: agent
      name: Values and direction
      summary: Test whether the objective reflects the user's own values and circumstances.
      role: Values-based goal strategist
      prompt: Clarify the underlying value, competing commitments, and evidence that the objective is
        genuinely the user's own. Define a concrete outcome without replacing their judgment.
      capabilities:
        skills:
          - values-based-goals
        tools:
          - read
          - search
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - findings
          - evidence
        properties:
          findings:
            type: array
            items:
              type: string
          evidence:
            type: array
            items:
              type: string
      position:
        x: 380
        y: 90
    - id: perspective-b
      kind: agent
      name: Behavior and friction
      summary: Design cues, small actions, environment, and recovery from misses.
      role: Habit formation and behavior-change coach
      prompt: Choose a repeatable minimum action, cue, immediate satisfaction signal, environmental
        changes, and a restart rule. Diagnose constraints rather than relying on willpower.
      capabilities:
        skills:
          - behavior-change
        tools:
          - read
          - search
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - findings
          - risks
        properties:
          findings:
            type: array
            items:
              type: string
          risks:
            type: array
            items:
              type: string
      position:
        x: 380
        y: 350
    - id: join
      kind: join
      name: Perspective barrier
      summary: Wait for both independent perspectives.
      config:
        join: all
      position:
        x: 660
        y: 220
    - id: synthesis
      kind: agent
      name: Sustainable system
      summary: Combine direction, actions, scheduling, and review into one lightweight plan.
      role: Productivity systems coach
      prompt: Create a minimal system of milestones, next actions, time or context cues, a weekly review,
        and explicit defer, delegate, or drop decisions.
      capabilities:
        skills:
          - productivity-systems
        tools:
          - read
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - recommendation
          - actions
          - openQuestions
        properties:
          recommendation:
            type: string
          actions:
            type: array
            items:
              type: string
          openQuestions:
            type: array
            items:
              type: string
      position:
        x: 900
        y: 150
    - id: evaluation
      kind: evaluate
      name: Alignment and safety gate
      summary: Check the recommendation against its evidence and contract.
      role: Reflective practice reviewer
      prompt: Pass only when the plan reflects the user's stated values, fits real constraints, avoids
        clinical claims, defines a small next action, and includes a humane review and adjustment
        rule.
      capabilities:
        skills:
          - evaluation
        tools:
          - read
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - score
          - passed
          - reasons
        properties:
          score:
            type: number
          passed:
            type: boolean
          reasons:
            type: array
            items:
              type: string
      config:
        threshold: 0.85
      position:
        x: 900
        y: 330
    - id: output
      kind: output
      name: Values-aligned action plan
      summary: Direction, milestones, habit design, environment changes, review cadence, and adjustment
        rules.
      position:
        x: 1180
        y: 220
  edges:
    - id: e1
      from: brief
      to: perspective-a
      kind: data
      contract: Brief
    - id: e2
      from: brief
      to: perspective-b
      kind: data
      contract: Brief
    - id: e3
      from: perspective-a
      to: join
      kind: data
      contract: EvidenceSet
    - id: e4
      from: perspective-b
      to: join
      kind: data
      contract: RiskSet
    - id: e5
      from: join
      to: synthesis
      kind: dependency
    - id: e6
      from: synthesis
      to: evaluation
      kind: data
      contract: Recommendation
    - id: e7
      from: evaluation
      to: output
      kind: control
      condition: passed == true
