apiVersion: ladder.dev/v1alpha1
kind: Workflow
metadata:
  name: opportunity-framing
  title: Opportunity framing + decision
  description: Balance user evidence with business constraints before recommending what to pursue.
  version: 1.0.0
spec:
  objective: Turn a broad opportunity into a clear product decision with measurable outcomes.
  policies:
    maxConcurrency: 3
    onFailure: preserve-completed
    requireApprovalFor: []
  nodes:
    - id: brief
      kind: input
      name: Opportunity brief
      summary: Problem signal, target users, strategic context, and constraints.
      position:
        x: 100
        y: 220
    - id: perspective-a
      kind: agent
      name: User evidence
      summary: Clarify the job, pain, alternatives, and urgency.
      role: Product discovery researcher
      prompt: Synthesize user evidence into jobs, pains, current alternatives, affected segments, and
        confidence levels.
      capabilities:
        skills:
          - product-discovery
        tools:
          - read
          - search
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - findings
          - evidence
        properties:
          findings:
            type: array
            items:
              type: string
          evidence:
            type: array
            items:
              type: string
      position:
        x: 380
        y: 90
    - id: perspective-b
      kind: agent
      name: Business constraints
      summary: Test strategic fit, feasibility, and opportunity cost.
      role: Product strategy analyst
      prompt: Assess strategic fit, constraints, dependencies, opportunity cost, and the evidence required
        before committing.
      capabilities:
        skills:
          - product-strategy
        tools:
          - read
          - search
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - findings
          - risks
        properties:
          findings:
            type: array
            items:
              type: string
          risks:
            type: array
            items:
              type: string
      position:
        x: 380
        y: 350
    - id: join
      kind: join
      name: Perspective barrier
      summary: Wait for both independent perspectives.
      config:
        join: all
      position:
        x: 660
        y: 220
    - id: synthesis
      kind: agent
      name: Opportunity decision
      summary: Define the problem, outcome, guardrails, and next bet.
      role: Principal product manager
      prompt: Reconcile user and business evidence into a crisp problem statement, success metrics,
        non-goals, and recommended next experiment.
      capabilities:
        skills:
          - product-management
        tools:
          - read
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - recommendation
          - actions
          - openQuestions
        properties:
          recommendation:
            type: string
          actions:
            type: array
            items:
              type: string
          openQuestions:
            type: array
            items:
              type: string
      position:
        x: 900
        y: 150
    - id: evaluation
      kind: evaluate
      name: Decision quality gate
      summary: Check the recommendation against its evidence and contract.
      role: Product review lead
      prompt: Pass only when the recommendation traces to evidence, names key uncertainty, and defines a
        measurable next decision point.
      capabilities:
        skills:
          - evaluation
        tools:
          - read
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - score
          - passed
          - reasons
        properties:
          score:
            type: number
          passed:
            type: boolean
          reasons:
            type: array
            items:
              type: string
      config:
        threshold: 0.85
      position:
        x: 900
        y: 330
    - id: output
      kind: output
      name: Product decision
      summary: Problem framing, outcome, tradeoffs, metrics, and next experiment.
      position:
        x: 1180
        y: 220
  edges:
    - id: e1
      from: brief
      to: perspective-a
      kind: data
      contract: Brief
    - id: e2
      from: brief
      to: perspective-b
      kind: data
      contract: Brief
    - id: e3
      from: perspective-a
      to: join
      kind: data
      contract: EvidenceSet
    - id: e4
      from: perspective-b
      to: join
      kind: data
      contract: RiskSet
    - id: e5
      from: join
      to: synthesis
      kind: dependency
    - id: e6
      from: synthesis
      to: evaluation
      kind: data
      contract: Recommendation
    - id: e7
      from: evaluation
      to: output
      kind: control
      condition: passed == true
