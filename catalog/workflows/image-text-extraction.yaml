apiVersion: ladder.dev/v1alpha1
kind: Workflow
metadata:
  name: image-text-extraction
  title: Image → structured text
  description: Extract text and layout from a supplied image, preserve uncertainty, and independently
    verify the result.
  version: 1.0.0
spec:
  objective: Produce accurate, reading-order-aware text and layout data from a user-supplied image.
  policies:
    maxConcurrency: 2
    onFailure: stop
    requireApprovalFor: []
  nodes:
    - id: source-image
      kind: input
      name: Source image
      summary: Host-provided image reference, extraction instructions, language hints, and rights context.
      inputSchema:
        type: object
        required:
          - asset
          - instructions
        properties:
          asset:
            type: string
            contentMediaType: image/*
            description: A host-provided data URL, local file reference, uploaded-asset identifier, or
              authorized HTTPS URL. Ladder Graph does not upload or fetch the asset.
          instructions:
            type: string
            description: What the workflow should extract, analyze, transform, or create.
          sourceRights:
            type: string
            description: User-supplied rights, consent, or provenance context when relevant.
        x-ladder-input-mode: image
      position:
        x: 100
        y: 200
    - id: extract
      kind: agent
      name: Extract text and layout
      summary: Read visible text without inventing obscured or illegible content.
      role: OCR and document-vision specialist
      prompt: Inspect the supplied image, preserve natural reading order, extract visible text, and record
        regions, tables, handwriting, language, and per-segment confidence. Mark illegible content
        explicitly; never reconstruct text from expectation alone.
      capabilities:
        skills:
          - image-understanding
          - optical-character-recognition
        tools:
          - read-media
        connectors: []
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - text
          - segments
          - language
          - uncertainties
        properties:
          text:
            type: string
          segments:
            type: array
            items:
              type: object
          language:
            type: string
          uncertainties:
            type: array
            items:
              type: string
      position:
        x: 400
        y: 200
    - id: verify
      kind: evaluate
      name: Extraction fidelity gate
      summary: Check reading order, omissions, confidence, and unsupported reconstruction.
      role: Independent document extraction reviewer
      prompt: Compare the extraction to the supplied image region by region. Pass only when visible text,
        layout, and reading order are preserved, uncertain characters are marked, and no unsupported
        text was invented.
      capabilities:
        skills:
          - image-understanding
          - evaluation
        tools:
          - read-media
          - read
        connectors: []
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - score
          - passed
          - issues
        properties:
          score:
            type: number
          passed:
            type: boolean
          issues:
            type: array
            items:
              type: string
      config:
        threshold: 0.95
      position:
        x: 700
        y: 200
    - id: output
      kind: output
      name: Verified text package
      summary: Return plain text, structured segments, layout metadata, confidence, and unresolved regions.
      position:
        x: 1000
        y: 200
  edges:
    - id: e1
      from: source-image
      to: extract
      kind: data
      contract: ImageInput
    - id: e2
      from: extract
      to: verify
      kind: data
      contract: ExtractionResult
    - id: e3
      from: verify
      to: output
      kind: control
      condition: passed == true
