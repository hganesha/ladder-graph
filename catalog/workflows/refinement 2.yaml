apiVersion: ladder.dev/v1alpha1
kind: Workflow
metadata:
  name: draft-critique-revise
  title: Draft, critique, revise
  description: Create a draft, score it independently, and revise inside a hard iteration bound.
  version: 1.0.0
spec:
  objective: Produce a high-quality deliverable that passes an explicit evaluation contract.
  policies:
    maxConcurrency: 2
    onFailure: stop
    requireApprovalFor: []
  nodes:
    - id: request
      kind: input
      name: User brief
      summary: The requested outcome and constraints.
      position:
        x: 110
        y: 90
    - id: draft
      kind: agent
      name: Create draft
      summary: Produce the smallest complete first version.
      role: Senior implementer
      prompt: Create a complete draft from the brief. State assumptions explicitly and satisfy every
        acceptance criterion.
      capabilities:
        skills:
          - implementation
        tools:
          - read
          - edit
        permissions:
          - workspace-write
      outputSchema:
        type: object
        required:
          - deliverable
          - assumptions
        properties:
          deliverable:
            type: string
          assumptions:
            type: array
            items:
              type: string
      position:
        x: 360
        y: 90
    - id: critique
      kind: evaluate
      name: Independent critique
      summary: Score the draft against the contract.
      role: Adversarial evaluator
      prompt: Evaluate the draft against the brief. Return a score from 0 to 1, pass/fail, defects with
        evidence, and the minimum revision needed.
      capabilities:
        skills:
          - evaluation
        tools:
          - read
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - score
          - passed
          - reasons
        properties:
          score:
            type: number
          passed:
            type: boolean
          reasons:
            type: array
            items:
              type: string
      config:
        threshold: 0.85
      position:
        x: 620
        y: 90
    - id: revise
      kind: agent
      name: Targeted revision
      summary: Fix only the evidenced defects.
      role: Revision specialist
      prompt: Revise the draft using the evaluator's defects. Preserve correct work, fix each evidenced
        issue, and return the revised deliverable.
      capabilities:
        skills:
          - implementation
        tools:
          - read
          - edit
        permissions:
          - workspace-write
      outputSchema:
        type: object
        required:
          - deliverable
          - resolved
        properties:
          deliverable:
            type: string
          resolved:
            type: array
            items:
              type: string
      position:
        x: 620
        y: 300
    - id: quality-loop
      kind: loop
      name: Quality loop
      summary: Repeat critique and revision until the threshold passes.
      config:
        body:
          - critique
          - revise
        exitCondition: critique.passed == true
        maxIterations: 3
        onExhausted: stop
      position:
        x: 870
        y: 190
    - id: result
      kind: output
      name: Approved deliverable
      summary: Return the passing deliverable and validation summary.
      position:
        x: 1120
        y: 190
  edges:
    - id: e-request-draft
      from: request
      to: draft
      kind: data
      contract: Brief
    - id: e-draft-critique
      from: draft
      to: critique
      kind: data
      contract: Draft
    - id: e-critique-revise
      from: critique
      to: revise
      kind: control
      condition: passed == false
    - id: e-revise-loop
      from: revise
      to: quality-loop
      kind: dependency
    - id: e-loop-result
      from: quality-loop
      to: result
      kind: control
      condition: passed == true
