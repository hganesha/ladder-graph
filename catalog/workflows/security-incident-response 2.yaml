apiVersion: ladder.dev/v1alpha1
kind: Workflow
metadata:
  name: security-incident-response
  title: Security incident response
  description: Triage, investigate, contain, recover, communicate, and preserve a defensible incident record.
  version: 1.0.0
spec:
  objective: Restore service safely, scope the compromise, preserve evidence, and communicate
    confirmed facts on time.
  policies:
    maxConcurrency: 3
    onFailure: preserve-completed
    requireApprovalFor:
      - containment
      - external-communications
  nodes:
    - id: alert
      kind: input
      name: Security alert
      summary: Alert, affected systems, timestamps, and available telemetry.
      position:
        x: 90
        y: 250
    - id: triage
      kind: agent
      name: SOC triage
      summary: Correlate signals and set an evidence-backed severity.
      role: Tier 1/2 SOC analyst
      prompt: Correlate alerts, enrich indicators, identify likely affected assets and users, and
        distinguish malicious activity, benign noise, and unknowns. Return severity, timeline,
        evidence, and escalation rationale.
      capabilities:
        skills:
          - soc-triage
          - incident-response
        tools:
          - read
          - monitor
        connectors:
          - mcp:siem
          - mcp:edr
          - mcp:threat-intel
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - severity
          - timeline
          - evidence
          - classification
        properties:
          severity:
            type: string
          timeline:
            type: array
            items:
              type: string
          evidence:
            type: array
            items:
              type: string
          classification:
            type: string
      position:
        x: 350
        y: 250
    - id: intel
      kind: agent
      name: Threat intelligence
      summary: Map relevant IOCs and durable adversary behavior.
      role: Threat intelligence analyst
      prompt: Enrich supplied indicators and behavior, map TTPs to MITRE ATT&CK, identify relevant
        campaigns, and label source, recency, and confidence. Do not overstate attribution.
      capabilities:
        skills:
          - threat-intelligence
          - research
        tools:
          - read
          - search
        connectors:
          - mcp:threat-intel
        permissions:
          - network-read
      outputSchema:
        type: object
        required:
          - indicators
          - ttps
          - assessment
        properties:
          indicators:
            type: array
            items:
              type: string
          ttps:
            type: array
            items:
              type: string
          assessment:
            type: string
      position:
        x: 630
        y: 90
    - id: dfir
      kind: agent
      name: Forensic investigation
      summary: Reconstruct the attack path and scope with chain of custody.
      role: DFIR specialist
      prompt: Preserve chain of custody, reconstruct the timeline, identify initial access and
        persistence, scope affected identities and systems, and separate confirmed facts from
        inference. Recommend evidence-preserving containment and eradication steps.
      capabilities:
        skills:
          - digital-forensics
          - incident-response
        tools:
          - read
          - monitor
        connectors:
          - mcp:siem
          - mcp:edr
          - mcp:incident-management
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - timeline
          - scope
          - facts
          - containment
        properties:
          timeline:
            type: array
            items:
              type: string
          scope:
            type: array
            items:
              type: string
          facts:
            type: array
            items:
              type: string
          containment:
            type: array
            items:
              type: string
      position:
        x: 630
        y: 410
    - id: investigation-join
      kind: join
      name: Investigation barrier
      summary: Join intelligence and forensic evidence.
      config:
        join: allSettled
      position:
        x: 900
        y: 250
    - id: containment-approval
      kind: approval
      name: Approve containment
      summary: Confirm business impact, evidence preservation, and rollback.
      position:
        x: 1140
        y: 250
    - id: response
      kind: agent
      name: Contain, eradicate, recover
      summary: Restore service with the smallest safe mitigation first.
      role: Incident commander and responder
      prompt: Execute only approved containment. Prioritize service restoration, preserve evidence, verify
        eradication against the observed attack path, monitor recurrence, and record actions,
        owners, timestamps, rollback, and remaining exposure.
      capabilities:
        skills:
          - incident-response
          - observability
        tools:
          - read
          - monitor
          - edit
        connectors:
          - mcp:siem
          - mcp:edr
          - mcp:incident-management
          - mcp:sentry
        permissions:
          - external-write
      outputSchema:
        type: object
        required:
          - actions
          - status
          - verification
          - residualRisk
        properties:
          actions:
            type: array
            items:
              type: string
          status:
            type: string
          verification:
            type: array
            items:
              type: string
          residualRisk:
            type: array
            items:
              type: string
      position:
        x: 1390
        y: 250
    - id: communications
      kind: agent
      name: Incident communications
      summary: Draft fact-based stakeholder and regulatory updates.
      role: Incident response communications lead
      prompt: Coordinate with legal and incident leadership. Track confirmed facts and
        jurisdiction-dependent deadlines, then draft sequenced internal, customer, regulator, and
        public communications without unsupported attribution or speculation.
      capabilities:
        skills:
          - incident-communications
          - incident-response
        tools:
          - read
          - edit
        connectors:
          - mcp:incident-management
          - mcp:grc
        permissions:
          - approval-required
      outputSchema:
        type: object
        required:
          - audiences
          - deadlines
          - drafts
        properties:
          audiences:
            type: array
            items:
              type: string
          deadlines:
            type: array
            items:
              type: string
          drafts:
            type: array
            items:
              type: string
      position:
        x: 1650
        y: 100
    - id: recovery-gate
      kind: evaluate
      name: Recovery and evidence gate
      summary: Verify health, containment, scope, and record quality.
      role: Independent incident review lead
      prompt: Pass only when service health is stable, containment and eradication are supported by
        evidence, monitoring covers recurrence, chain-of-custody records are intact, and unknowns
        and residual risk have owners.
      capabilities:
        skills:
          - incident-response
          - evaluation
        tools:
          - read
          - monitor
        connectors:
          - mcp:incident-management
          - mcp:sentry
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - score
          - passed
          - reasons
        properties:
          score:
            type: number
          passed:
            type: boolean
          reasons:
            type: array
            items:
              type: string
      config:
        threshold: 1
      position:
        x: 1650
        y: 400
    - id: close-join
      kind: join
      name: Closure barrier
      summary: Join communications and recovery evidence.
      config:
        join: all
      position:
        x: 1920
        y: 250
    - id: communications-approval
      kind: approval
      name: Approve external communications
      summary: Require explicit approval before distribution.
      position:
        x: 2160
        y: 250
    - id: output
      kind: output
      name: Incident record and handoff
      summary: Return timeline, scope, actions, evidence, communications, owners, and postmortem inputs.
      position:
        x: 2410
        y: 250
  edges:
    - id: e1
      from: alert
      to: triage
      kind: data
      contract: SecurityAlert
    - id: e2
      from: triage
      to: intel
      kind: data
      contract: TriageRecord
    - id: e3
      from: triage
      to: dfir
      kind: data
      contract: TriageRecord
    - id: e4
      from: intel
      to: investigation-join
      kind: data
      contract: ThreatIntel
    - id: e5
      from: dfir
      to: investigation-join
      kind: data
      contract: ForensicRecord
    - id: e6
      from: investigation-join
      to: containment-approval
      kind: dependency
    - id: e7
      from: containment-approval
      to: response
      kind: control
      condition: approved == true
    - id: e8
      from: response
      to: communications
      kind: data
      contract: ResponseRecord
    - id: e9
      from: response
      to: recovery-gate
      kind: data
      contract: ResponseRecord
    - id: e10
      from: communications
      to: close-join
      kind: data
      contract: CommunicationPlan
    - id: e11
      from: recovery-gate
      to: close-join
      kind: data
      contract: RecoveryEvidence
    - id: e12
      from: close-join
      to: communications-approval
      kind: dependency
    - id: e13
      from: communications-approval
      to: output
      kind: control
      condition: approved == true
