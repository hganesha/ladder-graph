apiVersion: ladder.dev/v1alpha1
kind: Workflow
metadata:
  name: multimodal-production
  title: Multimodal asset production
  description: Route an approved creative brief to image, video, or audio generation and gate the
    asset for quality, safety, rights, and provenance.
  version: 1.0.0
spec:
  objective: Produce a release-ready media asset through explicit model selection, cost approval,
    generation, and independent review.
  policies:
    maxConcurrency: 3
    onFailure: preserve-completed
    requireApprovalFor:
      - provider-cost
      - publication
  nodes:
    - id: brief
      kind: input
      name: Creative brief
      summary: Audience, modality, content, style, constraints, references, rights, and budget.
      inputSchema:
        type: object
        required:
          - assets
          - instructions
        properties:
          assets:
            type: array
            minItems: 1
            maxItems: 12
            items:
              type: object
              required:
                - uri
                - mediaType
              properties:
                uri:
                  type: string
                  description: A host-provided data URL, local file reference, uploaded-asset identifier, or
                    authorized HTTPS URL. Ladder Graph does not upload or fetch the asset.
                mediaType:
                  type: string
                  pattern: ^(image|audio|video|application)/
                name:
                  type: string
          instructions:
            type: string
        x-ladder-input-mode: mixed
      position:
        x: 80
        y: 260
    - id: model-selection
      kind: agent
      name: Model and request design
      summary: Choose modality, profile, parameters, and delivery behavior.
      role: Multimodal integration specialist
      prompt: Normalize the brief, choose image, video, speech, music, or transcription, and select a
        provider profile from verified current availability. Define prompt, references, dimensions
        or duration, format, cost ceiling, synchronous or async behavior, timeout, retries,
        provenance, and fallback. Never include credentials in output.
      capabilities:
        skills:
          - multimodal-model-selection
          - integration-engineering
          - async-media-jobs
        tools:
          - read
          - search
        connectors: []
        permissions:
          - network-read
      outputSchema:
        type: object
        required:
          - modality
          - model
          - request
          - costCeiling
          - delivery
        properties:
          modality:
            type: string
          model:
            type: string
          request:
            type: object
          costCeiling:
            type: number
          delivery:
            type: object
      position:
        x: 360
        y: 260
    - id: cost-approval
      kind: approval
      name: Approve provider request
      summary: Confirm provider, rights, cost ceiling, and external data transfer.
      position:
        x: 630
        y: 260
    - id: modality
      kind: condition
      name: Route modality
      summary: Dispatch only the approved generation branch.
      config:
        expression: model-selection.modality
        branches:
          - label: Image
            when: image
          - label: Video
            when: video
          - label: Audio
            when: audio
      position:
        x: 870
        y: 260
    - id: image
      kind: agent
      name: Generate or edit image
      summary: Create the approved image asset with bounded parameters.
      role: Image generation specialist
      prompt: Use the approved request and reference images. Generate or edit only within the brief,
        preserve requested invariants, capture model and parameter provenance, and return asset
        metadata plus provider-reported usage and cost.
      capabilities:
        skills:
          - image-generation
          - image-editing
        tools:
          - generate-media
        connectors:
          - api:openrouter/google/gemini-2.5-flash-image
        permissions:
          - external-write
      outputSchema:
        type: object
        required:
          - asset
          - mediaType
          - provenance
          - usage
        properties:
          asset:
            type: string
          mediaType:
            type: string
          provenance:
            type: object
          usage:
            type: object
      position:
        x: 1120
        y: 40
    - id: video
      kind: agent
      name: Generate video
      summary: Submit and collect the approved asynchronous video job.
      role: Video generation specialist
      prompt: Submit the approved storyboard and controls, retain the job identifier, poll with bounded
        exponential backoff or use the approved callback, stop on timeout, and return the completed
        asset with provenance, usage, and cost.
      capabilities:
        skills:
          - video-generation
          - async-media-jobs
        tools:
          - generate-media
          - poll
        connectors:
          - api:openrouter/google/veo-3.1-fast
        permissions:
          - external-write
      outputSchema:
        type: object
        required:
          - asset
          - jobId
          - provenance
          - usage
        properties:
          asset:
            type: string
          jobId:
            type: string
          provenance:
            type: object
          usage:
            type: object
      position:
        x: 1120
        y: 240
    - id: audio
      kind: agent
      name: Generate or transcribe audio
      summary: Produce speech or transcription from the approved request.
      role: Audio generation and transcription specialist
      prompt: Execute only the approved speech or transcription request with explicit voice or language,
        format, timestamps, uncertainty, and accessibility requirements. Return the asset or
        transcript with provenance, usage, and cost.
      capabilities:
        skills:
          - speech-generation
          - audio-transcription
        tools:
          - generate-media
        connectors:
          - api:openrouter/openai/gpt-audio-mini
        permissions:
          - external-write
      outputSchema:
        type: object
        required:
          - result
          - mediaType
          - provenance
          - usage
        properties:
          result:
            type: string
          mediaType:
            type: string
          provenance:
            type: object
          usage:
            type: object
      position:
        x: 1120
        y: 440
    - id: asset-join
      kind: join
      name: Asset collection
      summary: Collect the selected branch without waiting for unselected routes.
      config:
        join: first
      position:
        x: 1390
        y: 260
    - id: review
      kind: evaluate
      name: Media quality and safety gate
      summary: Check brief fidelity, safety, rights, privacy, and technical validity.
      role: Independent creative and media safety reviewer
      prompt: Evaluate the asset against the approved brief, reference constraints, technical format,
        accessibility, privacy, likeness and rights risk, unsafe or misleading content, and
        provenance completeness. Pass only with concrete evidence and no unresolved release blocker.
      capabilities:
        skills:
          - media-safety-review
          - evaluation
        tools:
          - read
        connectors: []
        permissions:
          - read-only
      outputSchema:
        type: object
        required:
          - score
          - passed
          - reasons
          - provenanceComplete
        properties:
          score:
            type: number
          passed:
            type: boolean
          reasons:
            type: array
            items:
              type: string
          provenanceComplete:
            type: boolean
      config:
        threshold: 0.9
      position:
        x: 1640
        y: 260
    - id: publish-approval
      kind: approval
      name: Approve publication
      summary: Require a human decision before releasing generated media.
      position:
        x: 1880
        y: 260
    - id: output
      kind: output
      name: Approved media package
      summary: Return asset, prompt and parameter provenance, usage, review evidence, and publication
        status.
      position:
        x: 2120
        y: 260
  edges:
    - id: e1
      from: brief
      to: model-selection
      kind: data
      contract: CreativeBrief
    - id: e2
      from: model-selection
      to: cost-approval
      kind: data
      contract: ProviderRequest
    - id: e3
      from: cost-approval
      to: modality
      kind: control
      condition: approved == true
    - id: e4
      from: modality
      to: image
      kind: control
      condition: modality == image
    - id: e5
      from: modality
      to: video
      kind: control
      condition: modality == video
    - id: e6
      from: modality
      to: audio
      kind: control
      condition: modality == audio
    - id: e7
      from: image
      to: asset-join
      kind: data
      contract: MediaAsset
    - id: e8
      from: video
      to: asset-join
      kind: data
      contract: MediaAsset
    - id: e9
      from: audio
      to: asset-join
      kind: data
      contract: MediaAsset
    - id: e10
      from: asset-join
      to: review
      kind: data
      contract: MediaAsset
    - id: e11
      from: review
      to: publish-approval
      kind: control
      condition: passed == true
    - id: e12
      from: publish-approval
      to: output
      kind: control
      condition: approved == true
