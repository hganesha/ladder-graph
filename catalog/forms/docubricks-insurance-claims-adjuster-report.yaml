            - id: loss-date
              name: loss_date
              label: Loss Date
              description: Date of loss.
              dataType: date
              widget: date
            - id: inspection-date
              name: inspection_date
              label: Inspection Date
              description: Date of inspection.
              dataType: date
              widget: date
            - id: recommended-reserve
              name: recommended_reserve
              label: Recommended Reserve
              description: Recommended reserve.
              dataType: number
              widget: number
            - id: recommended-payment
              name: recommended_payment
              label: Recommended Payment
              description: Recommended payment.
              dataType: number
              widget: number
        - id: document-details
          title: Document Details
          description: Document Details fields extracted from the document.
          fields:
            - id: claim-number
              name: claim_number
              label: Claim Number
              description: Claim number.
              dataType: string
              widget: text
              required: true
            - id: cause-of-loss-assessment
              name: cause_of_loss_assessment
              label: Cause Of Loss Assessment
              description: Adjuster's cause of loss assessment.
              dataType: string
              widget: text
            - id: damage-scope
              name: damage_scope
              label: Damage Scope
              description: Scope of covered or claimed damage.
              dataType: array
              widget: textarea
              span: 2
            - id: estimated-gross-loss
              name: estimated_gross_loss
              label: Estimated Gross Loss
