  submissionSchema:
    type: object
    properties:
      capa_number:
        type: string
        description: CAPA number.
      opened_date:
        type: date
        description: Date CAPA was opened.
        format: date
      source_type:
        type: string
        description: Audit, NCR, customer complaint, supplier issue, trend, or other source.
      source_reference:
        type: string
        description: Source record identifier.
      problem_statement:
        type: string
        description: Problem statement.
      risk_level:
        type: string
        description: Risk level or severity.
      root_cause:
        type: string
        description: Root cause.
      corrective_actions:
        type: array
        items:
          type: string
        description: Corrective actions.
      preventive_actions:
        type: array
        items:
          type: string
        description: Preventive actions.
      owner_name:
        type: string
        description: CAPA owner.
      target_completion_date:
        type: date
        description: Target completion date.
        format: date
      effectiveness_check_plan:
        type: string
        description: Effectiveness check plan.
      effectiveness_due_date:
        type: date
        description: Effectiveness check due date.
        format: date
      capa_status:
        type: string
        description: Open, implemented, pending effectiveness, closed, overdue, or other status.
      closure_date:
        type: date
        description: Closure date.
        format: date
    required:
      - capa_number
      - opened_date
      - problem_statement
      - root_cause
      - owner_name
      - target_completion_date
    additionalProperties: false
    x-ladder-docubricks:
      validationRules:
        - name: capa_number_present
          rule_type: presence
          fields:
            - capa_number
          expression: capa_number IS NOT NULL AND LENGTH(TRIM(capa_number)) > 0
          severity: fail
          description: capa_number is required for Corrective Preventive Action extraction.
        - name: opened_date_present
          rule_type: presence
          fields:
            - opened_date
          expression: opened_date IS NOT NULL AND LENGTH(TRIM(opened_date)) > 0
          severity: fail
          description: opened_date is required for Corrective Preventive Action extraction.
        - name: problem_statement_present
          rule_type: presence
          fields:
            - problem_statement
          expression: problem_statement IS NOT NULL AND LENGTH(TRIM(problem_statement)) > 0
          severity: fail
          description: problem_statement is required for Corrective Preventive Action extraction.
        - name: root_cause_present
          rule_type: presence
          fields:
            - root_cause
          expression: root_cause IS NOT NULL AND LENGTH(TRIM(root_cause)) > 0
          severity: fail
          description: root_cause is required for Corrective Preventive Action extraction.
        - name: owner_name_present
          rule_type: presence
          fields:
            - owner_name
          expression: owner_name IS NOT NULL AND LENGTH(TRIM(owner_name)) > 0
          severity: fail
          description: owner_name is required for Corrective Preventive Action extraction.
        - name: target_completion_date_present
          rule_type: presence
          fields:
            - target_completion_date
          expression: target_completion_date IS NOT NULL AND LENGTH(TRIM(target_completion_date)) > 0
          severity: fail
          description: target_completion_date is required for Corrective Preventive Action extraction.
      completenessChecklist:
        - id: required_fields_present
          description: All required fields are present or explicitly null with low confidence when absent.
          fields:
            - capa_number
            - opened_date
            - problem_statement
            - root_cause
            - owner_name
            - target_completion_date
        - id: section_coverage_reviewed
          description: Each declared section was reviewed for extractable evidence.
          sections:
            - dates_and_terms
            - document_details
            - line_items
            - parties
            - risk_and_compliance
        - id: nested_lists_normalized
          description: Object array fields use their item_schema for consistent nested extraction.
          fields: []
