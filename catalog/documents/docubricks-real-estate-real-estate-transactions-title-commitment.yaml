  validationRules:
    - id: commitment-number-present
      severity: error
      description: commitment_number is required for Title Commitment extraction.
      rule:
        op: and
        rules:
          - op: present
            field: commitment_number
          - op: gt
            left:
              length: commitment_number
            right:
              value: 0
      sourceExpression: commitment_number IS NOT NULL AND LENGTH(TRIM(commitment_number)) > 0
      supported: true
