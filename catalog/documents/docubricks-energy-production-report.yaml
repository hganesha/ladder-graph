      rule:
        op: or
        rules:
          - op: not
            rule:
              op: present
              field: ngl_volume_bbl
          - op: gte
            left:
              field: ngl_volume_bbl
            right:
              value: 0
      sourceExpression: ngl_volume_bbl IS NULL OR ngl_volume_bbl >= 0
      supported: true
  reviewPolicy:
    unsupportedRuleAction: human-review
    defaultConfidenceThreshold: 0.75
    fieldConfidence:
      production_date:
        minConfidence: 0.9
        reviewOnBreach: true
        failOnBreach: true
        regulatoryRequired: true
        rationale: High-impact field for Production Report workflow.
      lease_name:
        minConfidence: 0.9
        reviewOnBreach: true
        failOnBreach: true
        regulatoryRequired: true
        rationale: High-impact field for Production Report workflow.
      operator_name:
        minConfidence: 0.9
        reviewOnBreach: true
        failOnBreach: true
        regulatoryRequired: true
        rationale: High-impact field for Production Report workflow.
      oil_volume_bbl:
        minConfidence: 0.9
        reviewOnBreach: true
        failOnBreach: true
        regulatoryRequired: true
        rationale: High-impact field for Production Report workflow.
      gas_volume_mcf:
        minConfidence: 0.9
        reviewOnBreach: true
        failOnBreach: true
        regulatoryRequired: true
        rationale: High-impact field for Production Report workflow.
  modelRouting:
    primary: databricks-claude-sonnet
    fallbackChain:
      - databricks-meta-llama-3-70b-instruct
    maxTokens: 6144
    temperature: 0
    timeoutSeconds: 30
    maxRetries: 2
    tierOverrides: {}
    rationale: Production Report documents combine upstream operations, production accounting, field services,
      HSE, and lease control context.
  outputSchema:
    type: object
    properties:
      production_date:
        type: date
        description: Production date or reporting period end date.
        format: date
      lease_name:
        type: string
        description: Lease, unit, or facility name.
      operator_name:
        type: string
        description: Operating company.
      well_count:
        type: integer
        description: Number of wells included in the report.
      oil_volume_bbl:
        type: number
        description: Oil production volume in barrels.
      gas_volume_mcf:
        type: number
        description: Gas production volume in thousand cubic feet.
      water_volume_bbl:
        type: number
        description: Produced water volume in barrels.
      ngl_volume_bbl:
        type: number
        description: Natural gas liquids volume in barrels.
      beginning_inventory_bbl:
        type: number
        description: Beginning tank or lease oil inventory.
      ending_inventory_bbl:
        type: number
        description: Ending tank or lease oil inventory.
      sales_volume_bbl:
