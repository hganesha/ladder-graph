  validationRules:
    - id: case-name-present
      severity: error
      description: case_name is required for Litigation Case File extraction.
      rule:
        op: and
        rules:
          - op: present
            field: case_name
          - op: gt
            left:
              length: case_name
            right:
              value: 0
      sourceExpression: case_name IS NOT NULL AND LENGTH(TRIM(case_name)) > 0
      supported: true
    - id: case-status-present
      severity: error
      description: case_status is required for Litigation Case File extraction.
      rule:
        op: and
        rules:
          - op: present
            field: case_status
          - op: gt
            left:
              length: case_status
            right:
              value: 0
      sourceExpression: case_status IS NOT NULL AND LENGTH(TRIM(case_status)) > 0
      supported: true
    - id: exposure-amount-non-negative
      severity: warning
      description: exposure_amount should be non-negative when present.
      rule:
        op: or
        rules:
          - op: not
            rule:
              op: present
              field: exposure_amount
          - op: gte
            left:
              field: exposure_amount
            right:
              value: 0
      sourceExpression: exposure_amount IS NULL OR exposure_amount >= 0
      supported: true
  reviewPolicy:
