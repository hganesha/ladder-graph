      dataType: boolean
      sourcePath: /fields/authority_to_collect_rent
    - id: bank-account-control
      name: bank_account_control
      label: Bank Account Control
      description: Operating account, trust account, or cash management terms.
      dataType: string
      sourcePath: /fields/bank_account_control
    - id: termination-notice-days
