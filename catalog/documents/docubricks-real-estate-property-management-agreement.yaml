      sourcePath: /fields/property_name
    - id: property-address
      name: property_address
      label: Property Address
      description: Managed property address.
      dataType: string
      required: true
      sourcePath: /fields/property_address
    - id: management-start-date
      name: management_start_date
      label: Management Start Date
      description: Management start date.
      dataType: date
      required: true
      sourcePath: /fields/management_start_date
    - id: management-end-date
      name: management_end_date
      label: Management End Date
      description: Management expiration date or initial term end.
      dataType: date
      sourcePath: /fields/management_end_date
    - id: management-fee-terms
      name: management_fee_terms
      label: Management Fee Terms
      description: Management fee percentage, amount, or formula.
      dataType: string
      required: true
      sourcePath: /fields/management_fee_terms
    - id: leasing-fee-terms
