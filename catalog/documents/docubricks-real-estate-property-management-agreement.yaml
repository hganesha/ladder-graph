      label: Governing Law
      description: Governing state or jurisdiction.
      dataType: string
      sourcePath: /fields/governing_law
  validationRules:
    - id: agreement-date-present
      severity: error
      description: agreement_date is required for Property Management Agreement extraction.
      rule:
        op: and
        rules:
          - op: present
            field: agreement_date
          - op: gt
            left:
              length: agreement_date
            right:
              value: 0
      sourceExpression: agreement_date IS NOT NULL AND LENGTH(TRIM(agreement_date)) > 0
      supported: true
    - id: owner-name-present
      severity: error
      description: owner_name is required for Property Management Agreement extraction.
      rule:
        op: and
        rules:
          - op: present
            field: owner_name
          - op: gt
            left:
              length: owner_name
            right:
              value: 0
      sourceExpression: owner_name IS NOT NULL AND LENGTH(TRIM(owner_name)) > 0
      supported: true
    - id: manager-name-present
      severity: error
      description: manager_name is required for Property Management Agreement extraction.
      rule:
        op: and
        rules:
          - op: present
            field: manager_name
          - op: gt
            left:
              length: manager_name
            right:
              value: 0
      sourceExpression: manager_name IS NOT NULL AND LENGTH(TRIM(manager_name)) > 0
      supported: true
    - id: property-address-present
      severity: error
      description: property_address is required for Property Management Agreement extraction.
      rule:
        op: and
        rules:
          - op: present
            field: property_address
          - op: gt
            left:
              length: property_address
            right:
              value: 0
      sourceExpression: property_address IS NOT NULL AND LENGTH(TRIM(property_address)) > 0
      supported: true
    - id: management-start-date-present
      severity: error
      description: management_start_date is required for Property Management Agreement extraction.
      rule:
        op: and
        rules:
          - op: present
            field: management_start_date
          - op: gt
            left:
              length: management_start_date
            right:
              value: 0
      sourceExpression: management_start_date IS NOT NULL AND LENGTH(TRIM(management_start_date)) > 0
      supported: true
    - id: management-fee-terms-present
      severity: error
      description: management_fee_terms is required for Property Management Agreement extraction.
      rule:
        op: and
        rules:
          - op: present
            field: management_fee_terms
          - op: gt
            left:
              length: management_fee_terms
            right:
              value: 0
      sourceExpression: management_fee_terms IS NOT NULL AND LENGTH(TRIM(management_fee_terms)) > 0
      supported: true
    - id: termination-notice-days-non-negative
      severity: warning
      description: termination_notice_days should be non-negative when present.
      rule:
        op: or
        rules:
          - op: not
            rule:
              op: present
              field: termination_notice_days
          - op: gte
            left:
              field: termination_notice_days
            right:
              value: 0
      sourceExpression: termination_notice_days IS NULL OR termination_notice_days >= 0
      supported: true
  reviewPolicy:
