              op: present
              field: deductible_amount
          - op: gte
            left:
              field: deductible_amount
            right:
              value: 0
      sourceExpression: deductible_amount IS NULL OR deductible_amount >= 0
      supported: true
    - id: recommended-reserve-non-negative
      severity: warning
      description: recommended_reserve should be non-negative when present.
      rule:
        op: or
        rules:
          - op: not
            rule:
              op: present
              field: recommended_reserve
          - op: gte
            left:
              field: recommended_reserve
            right:
              value: 0
