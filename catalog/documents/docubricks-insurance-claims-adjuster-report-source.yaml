    - id: coverage-analysis-present
      severity: error
      description: coverage_analysis is required for Claims Adjuster Report extraction.
      rule:
        op: and
        rules:
          - op: present
            field: coverage_analysis
          - op: gt
            left:
              length: coverage_analysis
            right:
              value: 0
      sourceExpression: coverage_analysis IS NOT NULL AND LENGTH(TRIM(coverage_analysis)) > 0
      supported: true
    - id: estimated-gross-loss-non-negative
      severity: warning
      description: estimated_gross_loss should be non-negative when present.
      rule:
        op: or
        rules:
          - op: not
            rule:
              op: present
              field: estimated_gross_loss
          - op: gte
            left:
              field: estimated_gross_loss
            right:
              value: 0
      sourceExpression: estimated_gross_loss IS NULL OR estimated_gross_loss >= 0
      supported: true
    - id: deductible-amount-non-negative
      severity: warning
      description: deductible_amount should be non-negative when present.
      rule:
        op: or
        rules:
          - op: not
