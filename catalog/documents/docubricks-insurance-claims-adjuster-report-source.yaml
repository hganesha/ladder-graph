  validationRules:
    - id: report-date-present
      severity: error
      description: report_date is required for Claims Adjuster Report extraction.
      rule:
        op: and
        rules:
          - op: present
            field: report_date
          - op: gt
            left:
              length: report_date
            right:
              value: 0
      sourceExpression: report_date IS NOT NULL AND LENGTH(TRIM(report_date)) > 0
      supported: true
    - id: claim-number-present
      severity: error
      description: claim_number is required for Claims Adjuster Report extraction.
      rule:
        op: and
        rules:
          - op: present
            field: claim_number
          - op: gt
            left:
              length: claim_number
            right:
              value: 0
      sourceExpression: claim_number IS NOT NULL AND LENGTH(TRIM(claim_number)) > 0
      supported: true
    - id: adjuster-name-present
      severity: error
      description: adjuster_name is required for Claims Adjuster Report extraction.
      rule:
        op: and
        rules:
          - op: present
            field: adjuster_name
          - op: gt
            left:
              length: adjuster_name
            right:
              value: 0
      sourceExpression: adjuster_name IS NOT NULL AND LENGTH(TRIM(adjuster_name)) > 0
