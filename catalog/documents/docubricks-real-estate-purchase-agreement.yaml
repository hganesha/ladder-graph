      sourcePath: /fields/financing_contingency
    - id: inspection-contingency
      name: inspection_contingency
      label: Inspection Contingency
      description: Whether inspection contingency is stated.
      dataType: boolean
      sourcePath: /fields/inspection_contingency
    - id: title-company-name
      name: title_company_name
      label: Title Company Name
      description: Escrow agent or title company.
      dataType: string
      sourcePath: /fields/title_company_name
    - id: included-personal-property
      name: included_personal_property
      label: Included Personal Property
      description: Personal property included in sale.
      dataType: array
      sourcePath: /fields/included_personal_property
    - id: special-conditions
      name: special_conditions
      label: Special Conditions
      description: Special conditions or seller obligations.
      dataType: array
      sourcePath: /fields/special_conditions
    - id: governing-law
      name: governing_law
      label: Governing Law
      description: Governing state or jurisdiction.
      dataType: string
      sourcePath: /fields/governing_law
  validationRules:
    - id: agreement-date-present
      severity: error
      description: agreement_date is required for Purchase Agreement extraction.
      rule:
        op: present
        field: agreement_date
      sourceExpression: agreement_date IS NOT NULL AND LENGTH(TRIM(agreement_date)) > 0
      supported: true
    - id: buyer-name-present
      severity: error
      description: buyer_name is required for Purchase Agreement extraction.
      rule:
        op: present
        field: buyer_name
      sourceExpression: buyer_name IS NOT NULL AND LENGTH(TRIM(buyer_name)) > 0
      supported: true
    - id: seller-name-present
      severity: error
      description: seller_name is required for Purchase Agreement extraction.
      rule:
        op: present
        field: seller_name
      sourceExpression: seller_name IS NOT NULL AND LENGTH(TRIM(seller_name)) > 0
      supported: true
    - id: property-address-present
      severity: error
      description: property_address is required for Purchase Agreement extraction.
      rule:
        op: present
        field: property_address
      sourceExpression: property_address IS NOT NULL AND LENGTH(TRIM(property_address)) > 0
      supported: true
    - id: purchase-price-present
      severity: error
      description: purchase_price is required for Purchase Agreement extraction.
      rule:
        op: present
        field: purchase_price
      sourceExpression: purchase_price IS NOT NULL AND LENGTH(TRIM(purchase_price)) > 0
      supported: true
    - id: purchase-price-non-negative
      severity: warning
      description: purchase_price should be non-negative when present.
      rule:
        op: gte
        left:
          field: purchase_price
        right:
          value: 0
      sourceExpression: purchase_price IS NULL OR purchase_price >= 0
      supported: true
    - id: earnest-money-deposit-non-negative
      severity: warning
      description: earnest_money_deposit should be non-negative when present.
      rule:
        op: gte
        left:
          field: earnest_money_deposit
        right:
          value: 0
      sourceExpression: earnest_money_deposit IS NULL OR earnest_money_deposit >= 0
      supported: true
  reviewPolicy:
    unsupportedRuleAction: human-review
  outputSchema:
    type: object
    properties:
      agreement_date:
