        description: Scheduled closing date.
        format: date
      due_diligence_deadline:
        type: date
        description: Inspection or due diligence deadline.
        format: date
      financing_contingency:
        type: boolean
        description: Whether financing contingency is stated.
      inspection_contingency:
        type: boolean
        description: Whether inspection contingency is stated.
      title_company_name:
        type: string
        description: Escrow agent or title company.
      included_personal_property:
        type: array
        items:
          type: string
        description: Personal property included in sale.
      special_conditions:
        type: array
        items:
          type: string
        description: Special conditions or seller obligations.
      governing_law:
        type: string
        description: Governing state or jurisdiction.
    required:
      - agreement_date
      - buyer_name
      - seller_name
      - property_address
      - purchase_price
    additionalProperties: false
  inertSourceMetadata:
    family: real_estate_transactions
    completenessChecklist:
      - id: required_fields_present
        description: All required fields are present or explicitly null with low confidence when absent.
        fields:
          - agreement_date
          - buyer_name
          - seller_name
          - property_address
          - purchase_price
      - id: section_coverage_reviewed
        description: Each declared section was reviewed for extractable evidence.
        sections:
          - dates_and_terms
          - document_details
          - financials
          - parties
          - property_or_asset
      - id: nested_lists_normalized
        description: Object array fields use their item_schema for consistent nested extraction.
        fields: []
    sourceFiles:
