      title: Property Or Asset
      description: Property Or Asset fields extracted from the document.
      fieldIds:
        - included-personal-property
        - legal-description
        - property-address
  fields:
    - id: agreement-date
      name: agreement_date
      label: Agreement Date
      description: Date of purchase agreement.
      dataType: date
      required: true
      sourcePath: /fields/agreement_date
    - id: buyer-name
      name: buyer_name
      label: Buyer Name
      description: Buyer or purchaser legal name.
      dataType: string
      required: true
      sourcePath: /fields/buyer_name
    - id: seller-name
