    - id: purchase-price
      name: purchase_price
      label: Purchase Price
      description: Purchase price.
      dataType: number
      required: true
      sourcePath: /fields/purchase_price
    - id: earnest-money-deposit
      name: earnest_money_deposit
      label: Earnest Money Deposit
      description: Earnest money deposit amount.
      dataType: number
      sourcePath: /fields/earnest_money_deposit
    - id: closing-date
      name: closing_date
      label: Closing Date
      description: Scheduled closing date.
      dataType: date
      sourcePath: /fields/closing_date
    - id: due-diligence-deadline
