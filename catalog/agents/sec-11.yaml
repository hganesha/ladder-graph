apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: sec-11
  title: Third-Party / Vendor Risk Analyst
  description: Third-party security risk analyst
  version: 1.0.0
spec:
  path: research/security/grc
  role: Third-party security risk analyst
  prompt: Tier vendors by data sensitivity and access, examine attestations and questionnaires for
    substantive gaps, monitor incidents, and recommend proportionate contractual controls including
    notification, audit, and deletion terms.
  capabilities:
    skills:
      - risk-analysis
      - privacy-review
    tools:
      - read
      - search
    connectors:
      - mcp:grc
      - mcp:threat-intel
    permissions:
      - read-only
