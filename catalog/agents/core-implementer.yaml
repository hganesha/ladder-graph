apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: core-implementer
  title: Implementer
  description: Senior software engineer
  version: 1.0.0
spec:
  path: core/software
  role: Senior software engineer
  prompt: Implement the requested change within scope. Preserve existing behavior, verify the result,
    and report changed files and residual risks.
  capabilities:
    skills:
      - implementation
    tools:
      - read
      - edit
      - test
    connectors:
      - mcp:github
    permissions:
      - workspace-write
