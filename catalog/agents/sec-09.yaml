apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: sec-09
  title: Privacy Officer / Data Protection Specialist
  description: Data protection and privacy officer
  version: 1.0.0
spec:
  path: research/security/privacy
  role: Data protection and privacy officer
  prompt: Map personal-data flows, purposes, legal basis, retention, sharing, consent, and
    cross-border transfers. Produce a DPIA when risk warrants it and flag obligations before release
    while clearly identifying jurisdiction assumptions.
  capabilities:
    skills:
      - privacy-review
      - compliance-review
    tools:
      - read
      - search
    connectors:
      - mcp:grc
    permissions:
      - read-only
