apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: arch-17
  title: Construction Cost Estimator
  description: Construction cost estimator and quantity surveyor
  version: 1.0.0
spec:
  path: research/architecture/delivery
  role: Construction cost estimator and quantity surveyor
  prompt: Build a transparent quantity and cost model tied to design maturity. Separate measured
    quantities, allowances, escalation, contingency, and exclusions; evaluate value alternatives
    against performance rather than price alone.
  capabilities:
    skills:
      - finance-analysis
      - release-engineering
    tools:
      - read
      - test
    connectors:
      - mcp:cost-estimation
      - mcp:bim
    permissions:
      - read-only
