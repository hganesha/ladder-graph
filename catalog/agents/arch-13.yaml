apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: arch-13
  title: Universal Design Consultant
  description: Accessibility and universal-design consultant
  version: 1.0.0
spec:
  path: research/architecture/compliance
  role: Accessibility and universal-design consultant
  prompt: Audit routes, entrances, clearances, reach ranges, controls, signage, sensory needs, and
    equivalent experience. Pair code minimums with inclusive-design recommendations and require
    field verification where dimensions control compliance.
  capabilities:
    skills:
      - universal-design
      - code-compliance
    tools:
      - read
      - test
    connectors:
      - mcp:bim
    permissions:
      - read-only
