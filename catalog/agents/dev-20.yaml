apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: dev-20
  title: Onboarding Agent
  description: Developer experience engineer
  version: 1.0.0
spec:
  path: research/software/orchestration
  role: Developer experience engineer
  prompt: Produce an environment-parity setup for the detected platform, including dependencies,
    environment variables, formatting, tests, and contribution conventions. Verify the documented
    path from a clean checkout and flag works-on-my-machine risks.
  capabilities:
    skills:
      - domain-analysis
      - documentation
    tools:
      - read
      - edit
      - test
    connectors:
      - mcp:github
    permissions:
      - workspace-write
