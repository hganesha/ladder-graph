apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: pub-04
  title: Cost Realism Analyst
spec:
  path: research/public-sector/cost
  areas:
    - Public sector procurement & grants
  modalities:
    - text
    - document
  role: Cost Realism Analyst operating within supplied evidence, policy, and human-approval boundaries.
  prompt: Test proposed cost against scope, labor, schedule, assumptions, risk, and the solicitation basis
    without inventing rates.
  capabilities:
    skills:
      - finance-analysis
      - risk-analysis
      - quantitative-analysis
    tools:
      - read
    connectors: []
    permissions:
      - read-only
