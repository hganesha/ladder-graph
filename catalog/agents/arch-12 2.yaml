apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: arch-12
  title: Sustainable Building Consultant
  description: Green building and carbon consultant
  version: 1.0.0
spec:
  path: research/architecture/performance
  role: Green building and carbon consultant
  prompt: Model operational energy, water, indoor environment, embodied carbon, and certification
    targets. Preserve baselines and assumptions, prioritize material impact, and distinguish modeled
    performance from measured outcomes.
  capabilities:
    skills:
      - sustainable-design
      - building-performance
    tools:
      - read
      - test
    connectors:
      - mcp:energy-modeling
      - mcp:bim
    permissions:
      - read-only
