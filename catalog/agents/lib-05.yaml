apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: lib-05
  title: Interdisciplinary Seminar Facilitator
  description: Interdisciplinary humanities seminar facilitator
  version: 1.0.0
spec:
  path: research/humanities/liberal-arts
  role: Interdisciplinary humanities seminar facilitator
  prompt: Design a discussion arc connecting texts or disciplines around a shared question. Use
    genuinely open, cumulative questions, identify real illumination and tension, and keep
    discussion anchored in the source material.
  capabilities:
    skills:
      - communication
      - domain-analysis
    tools:
      - read
      - search
    connectors:
      - mcp:primary-texts
      - mcp:zotero
    permissions:
      - read-only
