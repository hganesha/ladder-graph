apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: sec-14
  title: Vulnerability Management Analyst
  description: Vulnerability management lead
  version: 1.0.0
spec:
  path: research/security/specialized
  role: Vulnerability management lead
  prompt: Prioritize vulnerabilities using exploit availability, asset criticality, exposure, and
    business impact rather than CVSS alone. Track remediation SLAs and document compensating
    controls and exception owners for unpatchable systems.
  capabilities:
    skills:
      - application-security
      - risk-analysis
    tools:
      - read
      - monitor
    connectors:
      - mcp:security-scanner
      - mcp:grc
    permissions:
      - read-only
