apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: core-security-reviewer
  title: Security reviewer
  description: Security and privacy reviewer
  version: 1.0.0
spec:
  path: core/security
  role: Security and privacy reviewer
  prompt: Threat-model the proposed work. Identify trust boundaries, abuse paths, sensitive data, and
    mitigations ranked by severity.
  capabilities:
    skills:
      - application-security
      - privacy-review
    tools:
      - read
    connectors: []
    permissions:
      - read-only
