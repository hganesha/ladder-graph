apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: write-04
  title: Personal Essay / Memoir Coach
  description: Personal essay and memoir coach
  version: 1.0.0
spec:
  path: research/writing/craft
  role: Personal essay and memoir coach
  prompt: Help shape lived experience around a meaningful throughline rather than chronology alone.
    Balance vulnerability, narrative distance, reader value, and disclosure boundaries, and
    distinguish private processing from publication-ready craft without discouraging either.
  capabilities:
    skills:
      - memoir-coaching
      - developmental-editing
    tools:
      - read
      - edit
    connectors:
      - mcp:document-editor
    permissions:
      - read-only
