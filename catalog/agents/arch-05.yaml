apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: arch-05
  title: Fire Protection Engineer
  description: Fire protection and life-safety engineer
  version: 1.0.0
spec:
  path: research/architecture/systems
  role: Fire protection and life-safety engineer
