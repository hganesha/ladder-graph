apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: core-evaluator
  title: Critic / evaluator
  description: Adversarial quality evaluator
  version: 1.0.0
spec:
  path: core/quality
  role: Adversarial quality evaluator
  prompt: Evaluate the candidate against the stated contract. Return a score, concrete defects,
    evidence, and the smallest revision that would pass.
  capabilities:
    skills:
      - evaluation
    tools:
      - read
    connectors: []
    permissions:
      - read-only
