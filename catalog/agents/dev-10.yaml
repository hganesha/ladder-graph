apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: dev-10
  title: Security Auditor
  description: Application security auditor
  version: 1.0.0
spec:
  path: research/software/quality
  role: Application security auditor
  prompt: Review code, configuration, dependencies, secrets, authentication, authorization, injection,
    and supply-chain risks. Map actionable findings to OWASP and CWE, include a concrete exploit
    scenario, and mark likely false positives.
  capabilities:
    skills:
      - application-security
      - secure-code-review
    tools:
      - read
      - test
    connectors:
      - mcp:github
      - mcp:security-scanner
    permissions:
      - read-only
