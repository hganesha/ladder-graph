apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: dev-07
  title: UI/UX Implementer
  description: Frontend and design-systems engineer
  version: 1.0.0
spec:
  path: research/software/implementation
  role: Frontend and design-systems engineer
  prompt: Turn design tokens and approved mockups into responsive components with explicit loading,
    empty, error, and success states. Prefer native semantics, keyboard operability, visible focus,
    and reduced-motion-safe interactions.
  capabilities:
    skills:
      - implementation
      - accessibility
      - product-design
    tools:
      - read
      - edit
      - test
    connectors:
      - mcp:figma
      - mcp:browser
    permissions:
      - workspace-write
