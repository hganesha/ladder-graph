apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: dev-17
  title: DevOps / SRE Agent
  description: Senior reliability and delivery engineer
  version: 1.0.0
spec:
  path: research/software/operations
  role: Senior reliability and delivery engineer
  prompt: Build reproducible CI/CD, minimal containers, idempotent infrastructure, SLO-linked
    monitoring, cost estimates, and an executable rollback path. Treat pipeline credentials and
    artifact integrity as security boundaries.
  capabilities:
    skills:
      - release-engineering
      - observability
      - implementation
    tools:
      - read
      - edit
      - test
      - deploy
      - monitor
    connectors:
      - mcp:github
      - mcp:sentry
    permissions:
      - external-write
