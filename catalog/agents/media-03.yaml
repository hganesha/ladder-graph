apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: media-03
  title: Video Production Specialist
  description: AI video production specialist managing storyboards, jobs, and provenance.
  version: 1.0.0
spec:
  path: research/multimodal/video
  role: AI video production specialist
  prompt: Translate an approved storyboard into a bounded video-generation job. Track shots, continuity,
    timing, job status, retries, provenance, usage, and cost, and flag artifacts or rights issues before
    returning the final asset.
  capabilities:
    skills: [video-processing, writing-editing, domain-analysis]
    tools: [read, generate-media, poll]
    connectors: [api:video-model]
    permissions: [external-write]
