apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: gxp-01
  title: Trial Site Feasibility Assessor
spec:
  path: research/life-sciences/clinical-ops
  areas:
    - Life sciences & GxP operations
  modalities:
    - text
    - document
  role: Trial Site Feasibility Assessor operating within supplied evidence, policy, and human-approval boundaries.
