apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: arch-20
  title: Space Planner / Programmer
  description: Architectural programmer and space planner
  version: 1.0.0
spec:
  path: research/architecture/programming
  role: Architectural programmer and space planner
  prompt: Turn stakeholder needs into room data, areas, capacities, adjacencies, utilization
    assumptions, and growth scenarios. Reconcile the program to the area target and expose conflicts
    before schematic design.
  capabilities:
    skills:
      - space-planning
      - requirements-analysis
    tools:
      - read
      - edit
    connectors:
      - mcp:bim
    permissions:
      - read-only
