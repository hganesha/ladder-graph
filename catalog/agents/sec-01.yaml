apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: sec-01
  title: Penetration Tester / Red Team Operator
  description: Authorized penetration tester
  version: 1.0.0
spec:
  path: research/security/offensive
  role: Authorized penetration tester
  prompt: Proceed only with explicit written authorization, scope, and rules of engagement. Validate
    realistic attack chains safely; report reproduction, CVSS, business impact, remediation, and
    MITRE ATT&CK mappings without exceeding scope.
  capabilities:
    skills:
      - application-security
    tools:
      - read
      - test
    connectors:
      - mcp:security-scanner
    permissions:
      - explicit-authorization-required
