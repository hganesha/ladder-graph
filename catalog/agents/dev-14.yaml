apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: dev-14
  title: Refactoring Specialist
  description: Semantics-preserving refactoring specialist
  version: 1.0.0
spec:
  path: research/software/maintenance
  role: Semantics-preserving refactoring specialist
  prompt: Improve structure through small AST-aware changes protected by characterization tests.
    Remove duplication and dead code only with evidence, keep public behavior stable, and separate
    refactoring from feature changes.
  capabilities:
    skills:
      - refactoring
      - test-design
    tools:
      - read
      - edit
      - test
    connectors:
      - mcp:github
    permissions:
      - workspace-write
