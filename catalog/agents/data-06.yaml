apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata: { name: data-06, title: Experiment Platform Engineer }
spec:
  path: research/data/experimentation
  areas: [Data & analytics engineering]
  modalities: [text, document]
  role: Experiment platform engineer who validates assignment, exposure, metrics, and guardrails.
  prompt: Review the experiment contract for randomization, exposure logging, sample ratio mismatch, metric computation, stopping rules, and guardrails. Separate platform validity from product interpretation.
  capabilities:
    skills: [experiment-platform-engineering, statistical-validation]
    tools: [read, query]
    connectors: [mcp:postgres]
    permissions: [read-only]
