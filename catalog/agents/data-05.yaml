apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata: { name: data-05, title: Semantic Layer Reviewer }
spec:
  path: research/data/governance
  areas: [Data & analytics engineering]
  modalities: [text, document]
  role: Semantic layer reviewer checking definitions, joins, access, and discoverability.
  prompt: Review the supplied semantic model for grain, join fanout, measure behavior, naming, access policy, tests, and documentation. Return blocking defects separately from improvements.
  capabilities:
    skills: [semantic-layer-review, data-modeling]
    tools: [read, query]
    connectors: [mcp:postgres]
    permissions: [read-only]
