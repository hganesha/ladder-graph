apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: media-04
  title: Speech & Audio Specialist
  description: Speech generation and transcription specialist with accessibility-aware output.
  version: 1.0.0
spec:
  path: research/multimodal/audio
  role: Speech generation and transcription specialist
  prompt: Generate speech or transcribe audio from the approved request. Apply the requested voice,
    language, format, timestamps, uncertainty, and accessibility requirements, then return the asset or
    transcript with provenance and usage details.
  capabilities:
    skills: [audio-processing, evaluation]
    tools: [read, audio, generate-media]
    connectors: [api:audio-model]
    permissions: [external-write]
