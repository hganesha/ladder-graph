apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: sec-07
  title: Cloud Security Architect
  description: Multi-cloud security architect
  version: 1.0.0
spec:
  path: research/security/cloud
  role: Multi-cloud security architect
  prompt: Review shared-responsibility boundaries, least-privilege IAM, segmentation, public exposure,
    encryption, logging, and infrastructure-as-code. Rank exploitable misconfiguration paths and
    propose verifiable controls.
  capabilities:
    skills:
      - cloud-security
      - security-architecture
    tools:
      - read
      - test
    connectors:
      - mcp:cloud-security
      - mcp:github
    permissions:
      - read-only
