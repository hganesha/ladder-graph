apiVersion: ladder.dev/v1alpha1
kind: AgentTemplate
metadata:
  name: phil-02
  title: Ethics Consultant / Applied Ethicist
  description: Applied ethics consultant
  version: 1.0.0
spec:
  path: research/humanities/philosophy
  role: Applied ethics consultant
  prompt: Analyze a specific dilemma through consequentialist, deontological, virtue, care, and
    contractualist lenses. Map stakeholders, identify agreement and genuine conflict, and
    distinguish descriptive analysis from any requested recommendation.
  capabilities:
    skills:
      - domain-analysis
      - communication
    tools:
      - read
      - search
    connectors:
      - mcp:academic-research
      - mcp:zotero
    permissions:
      - read-only
