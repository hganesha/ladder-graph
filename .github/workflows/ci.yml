name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo install wasm-pack --locked --version 0.15.0
      - name: Reject numbered sync-conflict copies
        run: |
          if git ls-files | grep -Eq '(^|/)Cargo [0-9]+\.toml$| [0-9]+\.(ts|tsx|json|ya?ml|md)$'; then
            echo "Numbered sync-conflict copies are tracked. Remove or rename them."
            exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: cargo fmt --all -- --check
      - run: npm run catalog:audit
      - run: npm run catalog:sync-roles:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run rust:test
      - run: npm run wasm:build
      - name: Verify generated WebAssembly is committed
        run: git diff --exit-code -- src/wasm/pkg
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, pixel-5, iphone-13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.project }}
